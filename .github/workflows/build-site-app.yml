name: Build Site App

# Manual run only: Actions tab -> "Build Site App" -> Run workflow.
# Makes ONE standalone app (Firefox engine + uBlock Origin) for ONE website.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "অ্যাপের নাম (যেমন YouTube)"
        required: true
      url:
        description: "সাইটের লিংক (https:// দিয়ে শুরু, যেমন https://m.youtube.com)"
        required: true
      id:
        description: "ছোট ইংরেজি আইডি, শুধু a-z আর 0-9 (যেমন youtube)"
        required: true
      icon_url:
        description: "আইকন ছবির লিংক (খালি রাখলে সাইটের favicon আসবে)"
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      IN_NAME: ${{ inputs.name }}
      IN_URL: ${{ inputs.url }}
      IN_ID: ${{ inputs.id }}
      IN_ICON: ${{ inputs.icon_url }}
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write project files
        run: |
          mkdir -p site-app
          mkdir -p site-app
          cat > site-app/settings.gradle <<'__SITEAPP_EOF__'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://maven.mozilla.org/maven2/" }
              }
          }
          rootProject.name = "SiteApp"
          include ":app"
          __SITEAPP_EOF__
          mkdir -p site-app
          cat > site-app/build.gradle <<'__SITEAPP_EOF__'
          plugins {
              id 'com.android.application' version '8.10.1' apply false
          }
          __SITEAPP_EOF__
          mkdir -p site-app
          cat > site-app/gradle.properties <<'__SITEAPP_EOF__'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=36
          __SITEAPP_EOF__
          mkdir -p site-app/app
          cat > site-app/app/build.gradle <<'__SITEAPP_EOF__'
          plugins {
              id 'com.android.application'
          }

          def prop = { String k, String d -> providers.gradleProperty(k).getOrElse(d) }
          def esc  = { String s -> s.replace('\\', '\\\\').replace('"', '\\"') }

          android {
              namespace 'com.hridoy.siteapp'
              compileSdk 36

              defaultConfig {
                  applicationId prop('appId', 'com.hridoy.site.demo')
                  minSdk 26
                  targetSdk 34
                  versionCode prop('verCode', '1').toInteger()
                  versionName "1.0"
                  // only 64-bit phones: keeps the APK much smaller
                  ndk { abiFilters 'arm64-v8a' }
                  resValue "string", "app_name", prop('siteName', 'Site')
                  buildConfigField "String", "SITE_URL", "\"${esc(prop('siteUrl', 'https://m.youtube.com'))}\""
              }

              buildFeatures { buildConfig true }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release { minifyEnabled false }
              }
          }

          dependencies {
              // Firefox engine. Version can be overridden: -PgeckoVer=152.+
              implementation "org.mozilla.geckoview:geckoview:${prop('geckoVer', '152.+')}"
          }
          __SITEAPP_EOF__
          mkdir -p site-app/app/src/main
          cat > site-app/app/src/main/AndroidManifest.xml <<'__SITEAPP_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __SITEAPP_EOF__
          mkdir -p site-app/app/src/main/res/values
          cat > site-app/app/src/main/res/values/styles.xml <<'__SITEAPP_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          __SITEAPP_EOF__
          mkdir -p site-app/app/src/main/res/values
          cat > site-app/app/src/main/res/values/colors.xml <<'__SITEAPP_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          __SITEAPP_EOF__
          mkdir -p site-app/app/src/main/res/mipmap-anydpi-v26
          cat > site-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'__SITEAPP_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          __SITEAPP_EOF__
          mkdir -p site-app/app/src/main/java/com/hridoy/siteapp
          cat > site-app/app/src/main/java/com/hridoy/siteapp/MainActivity.java <<'__SITEAPP_EOF__'
          package com.hridoy.siteapp;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Toast;

          import org.mozilla.geckoview.AllowOrDeny;
          import org.mozilla.geckoview.GeckoResult;
          import org.mozilla.geckoview.GeckoRuntime;
          import org.mozilla.geckoview.GeckoRuntimeSettings;
          import org.mozilla.geckoview.GeckoSession;
          import org.mozilla.geckoview.GeckoView;

          /**
           * One website, full screen, no browser bar. Engine: Firefox (GeckoView).
           * Ad blocking: uBlock Origin, bundled in assets/ublock and loaded at start.
           */
          public class MainActivity extends Activity {
              private static final String UBO_PATH = "resource://android/assets/ublock/";
              private static final String UBO_ID = "uBlock0@raymondhill.net";

              private static GeckoRuntime sRuntime;

              private GeckoView view;
              private GeckoSession session;
              private boolean canGoBack = false;
              private boolean fullScreen = false;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  view = new GeckoView(this);
                  setContentView(view);

                  if (sRuntime == null) {
                      GeckoRuntimeSettings settings = new GeckoRuntimeSettings.Builder().build();
                      sRuntime = GeckoRuntime.create(getApplicationContext(), settings);
                      loadBlocker(sRuntime);
                  }

                  session = new GeckoSession();
                  session.setNavigationDelegate(new GeckoSession.NavigationDelegate() {
                      @Override
                      public void onCanGoBack(GeckoSession s, boolean can) {
                          canGoBack = can;
                      }

                      @Override
                      public GeckoResult<AllowOrDeny> onLoadRequest(GeckoSession s, LoadRequest request) {
                          String u = request.uri == null ? "" : request.uri;
                          if (u.startsWith("http://") || u.startsWith("https://")
                                  || u.startsWith("about:") || u.startsWith("blob:")
                                  || u.startsWith("data:")) {
                              return GeckoResult.fromValue(AllowOrDeny.ALLOW);
                          }
                          // mailto:, tel:, intent:, market: ... -> hand over to the phone
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u)));
                          } catch (Exception ignored) {
                          }
                          return GeckoResult.fromValue(AllowOrDeny.DENY);
                      }

                      @Override
                      public GeckoResult<GeckoSession> onNewSession(GeckoSession s, String uri) {
                          // window.open / target=_blank: stay in this window
                          if (uri != null) s.loadUri(uri);
                          return null;
                      }
                  });
                  session.setContentDelegate(new GeckoSession.ContentDelegate() {
                      @Override
                      public void onFullScreen(GeckoSession s, boolean on) {
                          fullScreen = on;
                          setImmersive(on);
                      }
                  });

                  session.open(sRuntime);
                  view.setSession(session);
                  if (saved == null) session.loadUri(BuildConfig.SITE_URL);
              }

              private void loadBlocker(GeckoRuntime rt) {
                  try {
                      rt.getWebExtensionController()
                              .ensureBuiltIn(UBO_PATH, UBO_ID)
                              .accept(
                                      ext -> say("Adblock চালু (uBlock Origin)"),
                                      err -> say("Adblock চালু হয়নি: " + err));
                  } catch (Throwable t) {
                      say("Adblock চালু হয়নি: " + t);
                  }
              }

              private void say(final String msg) {
                  runOnUiThread(() -> Toast.makeText(this, msg, Toast.LENGTH_LONG).show());
              }

              @SuppressWarnings("deprecation")
              private void setImmersive(boolean on) {
                  View d = getWindow().getDecorView();
                  d.setSystemUiVisibility(on
                          ? (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN)
                          : View.SYSTEM_UI_FLAG_VISIBLE);
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (fullScreen) {
                      session.exitFullScreen();
                  } else if (canGoBack) {
                      session.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          __SITEAPP_EOF__
          mkdir -p site-app
          cat > site-app/make_icon.py <<'__SITEAPP_EOF__'
          """make_icon.py NAME URL ICON_URL OUT_RES_DIR  -> adaptive-icon foreground (432x432)."""
          import io, os, sys, urllib.parse, urllib.request
          from PIL import Image, ImageDraw, ImageFont

          name, url, icon_url, out = sys.argv[1:5]
          host = urllib.parse.urlparse(url).hostname or ""
          S = 432


          def fetch(u):
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = r.read(3_000_000)
                  im = Image.open(io.BytesIO(data)).convert("RGBA")
                  return im if min(im.size) >= 32 else None
              except Exception as e:
                  print("icon fetch failed:", u, e)
                  return None


          src = fetch(icon_url) if icon_url else None
          if src is None and host:
              src = fetch("https://www.google.com/s2/favicons?domain=%s&sz=128" % host)

          if src is not None:
              canvas = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              art = src.resize((250, 250), Image.LANCZOS)
              canvas.paste(art, ((S - 250) // 2, (S - 250) // 2), art)
          else:
              h = abs(hash(name)) % 360
              canvas = Image.new("RGBA", (S, S), (40, 40, 60, 255))
              d = ImageDraw.Draw(canvas)
              d.ellipse((66, 66, S - 66, S - 66), fill=(110 + h % 100, 90, 200 - h % 100, 255))
              font = None
              for p in ("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",):
                  if os.path.exists(p):
                      font = ImageFont.truetype(p, 170)
              if font is None:
                  font = ImageFont.load_default(size=170)
              letter = (name[:1] or "S").upper()
              d.text((S / 2, S / 2), letter, fill="white", font=font, anchor="mm")

          dest = os.path.join(out, "drawable-nodpi")
          os.makedirs(dest, exist_ok=True)
          canvas.save(os.path.join(dest, "ic_launcher_foreground.png"))
          print("icon written")
          __SITEAPP_EOF__
          mkdir -p site-app
          cat > site-app/prepare.py <<'__SITEAPP_EOF__'
          """Validates workflow inputs and exports clean values to $GITHUB_ENV."""
          import os, re, sys

          name = re.sub(r"[\"'<>&\\%@?$`\r\n]", "", os.environ.get("IN_NAME", "")).strip()[:40] or "Site"
          url = os.environ.get("IN_URL", "").strip()
          sid = os.environ.get("IN_ID", "").strip()
          icon = os.environ.get("IN_ICON", "").strip()

          if not re.fullmatch(r"https://[^\s\"'<>\\`$]+", url):
              sys.exit("URL must start with https:// and contain no spaces or quotes")
          if not re.fullmatch(r"[a-z][a-z0-9]{1,30}", sid):
              sys.exit("id must be 2-31 chars: a-z and 0-9, starting with a letter")
          if icon and not re.fullmatch(r"https://[^\s\"'<>\\`$]+", icon):
              icon = ""

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("SITE_NAME=%s\nSITE_URL=%s\nSITE_ID=%s\nSITE_ICON=%s\n" % (name, url, sid, icon))
          print("ok:", name, url, sid)
          __SITEAPP_EOF__

      - name: Check inputs
        run: python site-app/prepare.py

      - name: Get uBlock Origin (Firefox build)
        run: |
          cd site-app
          curl -fsSL -A "Mozilla/5.0" -o ublock.xpi \
            "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
          rm -rf app/src/main/assets/ublock
          mkdir -p app/src/main/assets/ublock
          unzip -q ublock.xpi -d app/src/main/assets/ublock
          rm -rf app/src/main/assets/ublock/META-INF
          test -f app/src/main/assets/ublock/manifest.json
          grep -o '"version"[^,]*' app/src/main/assets/ublock/manifest.json | head -1

      - name: Icon
        run: |
          pip install pillow
          python site-app/make_icon.py "$SITE_NAME" "$SITE_URL" "$SITE_ICON" site-app/app/src/main/res

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        working-directory: site-app
        run: |
          gradle assembleRelease --no-daemon \
            -PsiteName="$SITE_NAME" \
            -PsiteUrl="$SITE_URL" \
            -PappId="com.hridoy.site.$SITE_ID" \
            -PverCode="${{ github.run_number }}"

      - name: Align and sign
        run: |
          base64 -d heart-orbit.keystore.b64 > heart-orbit.keystore
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          UNSIGNED=$(find site-app/app/build/outputs/apk/release -name '*.apk' | head -1)
          $ANDROID_HOME/build-tools/$BT/zipalign -f -p 4 "$UNSIGNED" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks heart-orbit.keystore \
            --ks-key-alias heartorbit \
            --ks-pass pass:heartorbit-ks-2026 \
            --key-pass pass:heartorbit-ks-2026 \
            --out "$SITE_ID.apk" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify "$SITE_ID.apk"
          ls -lh "$SITE_ID.apk"

      # Artifact only. Do NOT create a GitHub Release here: Heart Orbit's
      # update check reads "releases/latest" and would get confused.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.id }}-apk
          path: ${{ inputs.id }}.apk
